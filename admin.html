<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Headcount Event</title>
    
    <!-- Muat turun Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fon Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#679929',
                            greenHover: '#558021',
                            charcoal: '#464B4F',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        @keyframes munculLancarAdmin {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes gegarPin {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .smooth-enter {
            animation: munculLancarAdmin 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .admin-item-enter {
            animation: munculLancarAdmin 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
        .pin-shake {
            animation: gegarPin 0.35s ease-in-out;
        }
    </style>
</head>
<body class="relative overflow-x-hidden bg-gradient-to-br from-[#eef5e6] via-[#f8faf7] to-[#e6ece4] dark:from-[#121513] dark:via-[#181b19] dark:to-[#1d221e] text-[#464B4F] dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col transition-colors duration-300">

    <!-- Latar Belakang Cahaya Ambien (Glassmorphism) -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-20 w-96 h-96 rounded-full bg-[#679929]/25 dark:bg-[#679929]/20 blur-3xl"></div>
        <div class="absolute top-1/2 -right-24 w-96 h-96 rounded-full bg-[#86be3b]/20 dark:bg-[#86be3b]/15 blur-3xl"></div>
        <div class="absolute -bottom-24 left-1/3 w-96 h-96 rounded-full bg-[#464B4F]/15 dark:bg-[#464B4F]/30 blur-3xl"></div>
    </div>

    <!-- Skrin Kunci PIN Admin -->
    <div id="pinLockOverlay" class="fixed inset-0 z-40 flex items-center justify-center p-4 bg-[#eef5e6]/90 dark:bg-[#0d100e]/95 backdrop-blur-xl transition-opacity duration-300">
        <div id="pinCardBox" class="relative w-full max-w-[360px] p-7 sm:p-8 rounded-[28px] bg-white/85 dark:bg-[#191d1a]/95 backdrop-blur-2xl border border-black/10 dark:border-white/10 shadow-[0_20px_50px_rgba(0,0,0,0.18)] text-center smooth-enter">
            <!-- Butang Penukar Tema di Penjuru Atas Kanan Kad -->
            <button id="themeTogglePin" type="button" aria-label="Tukar mod gelap atau cerah" class="absolute top-5 right-5 w-10 h-10 rounded-full flex items-center justify-center bg-black/[0.04] dark:bg-white/[0.06] border border-black/10 dark:border-white/10 text-[#464B4F] dark:text-slate-200 hover:bg-black/[0.08] dark:hover:bg-white/[0.12] transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block dark:hidden text-[#464B4F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>

            <!-- Logo Profil Bulat -->
            <div class="mt-4 mb-4 flex justify-center">
                <div class="p-1.5 rounded-full bg-[#464B4F]/15 dark:bg-black/40 border border-[#464B4F]/20 dark:border-white/15 shadow-sm">
                    <img src="./logoprofil.png" onerror="this.onerror=null;this.src='https://placehold.co/160x160/679929/ffffff?text=AZZUHA';" alt="Logo Azzuha" class="w-20 h-20 rounded-full object-cover bg-[#77b12c] block">
                </div>
            </div>

            <h2 class="text-xl font-bold tracking-tight text-[#464B4F] dark:text-white">Log Masuk Panel Admin</h2>
            <p class="text-xs font-semibold text-[#679929] dark:text-[#86be3b] mt-1 mb-6">Headcount Event</p>
            
            <form id="pinUnlockForm" class="space-y-4">
                <div>
                    <label for="pinCodeInput" class="block text-[11px] font-bold uppercase tracking-[0.12em] text-[#464B4F]/70 dark:text-slate-400 mb-2.5">
                        MASUKKAN PIN
                    </label>
                    <input type="password" id="pinCodeInput" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="• • • •" autocomplete="off" required
                           class="w-full text-center tracking-[0.55em] pl-[0.55em] text-2xl font-bold py-3.5 px-4 rounded-2xl bg-black/[0.03] dark:bg-[#111412] border border-black/15 dark:border-white/15 text-[#464B4F] dark:text-white placeholder:text-[#464B4F]/35 dark:placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-[#86be3b] focus:border-transparent transition-all">
                </div>
                <p id="pinErrorMsg" class="hidden text-xs font-medium text-rose-500">PIN tidak sah. Sila cuba lagi.</p>
                <button type="submit" class="w-full py-3.5 px-4 rounded-2xl bg-[#86be3b] hover:bg-[#77ad30] text-[#11180d] text-sm font-bold shadow-[0_8px_24px_rgba(134,190,59,0.28)] active:scale-[0.99] transition-all inline-flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" x2="3" y1="12" y2="12"/></svg>
                    <span>Log Masuk</span>
                </button>
            </form>
        </div>
    </div>

    <main id="adminMainContent" class="hidden w-full max-w-2xl mx-auto px-4 py-8 flex-1 flex flex-col">
        <!-- Kepala Halaman Admin -->
        <div class="flex items-center justify-between gap-4 p-5 mb-6 rounded-3xl bg-white/60 dark:bg-white/[0.06] backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-[0_8px_32px_rgba(70,75,79,0.06)]">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-[#464B4F] dark:text-white">Panel Admin</h1>
                <p class="text-xs text-[#464B4F]/75 dark:text-slate-300 mt-0.5">Urus senarai pautan dan maklumat profil anda</p>
            </div>
            <button id="themeToggleAdmin" type="button" aria-label="Tukar mod gelap atau cerah" class="p-2.5 rounded-xl bg-white/70 dark:bg-white/10 backdrop-blur-md border border-white/80 dark:border-white/15 text-[#464B4F] dark:text-slate-200 hover:bg-white/90 dark:hover:bg-white/20 transition-all shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block dark:hidden text-[#464B4F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </button>
        </div>

        <!-- Kad Utama Halaman Admin (Glassmorphism) -->
        <div class="bg-white/60 dark:bg-white/[0.06] backdrop-blur-xl rounded-3xl border border-white/80 dark:border-white/15 shadow-[0_8px_32px_rgba(70,75,79,0.08)] overflow-hidden smooth-enter">
            <!-- Tab Navigasi Admin -->
            <div class="flex border-b border-white/60 dark:border-white/10 px-5 pt-3 gap-6 text-xs font-semibold bg-white/40 dark:bg-white/[0.03]">
                <button type="button" data-tab="tabPautan" class="admin-tab pb-3 border-b-2 border-[#679929] text-[#679929] dark:text-[#86be3b] transition-colors duration-200">
                    Senarai Pautan
                </button>
                <button type="button" data-tab="tabProfil" class="admin-tab pb-3 border-b-2 border-transparent text-[#464B4F]/70 dark:text-slate-400 hover:text-[#464B4F] dark:hover:text-slate-200 transition-colors duration-200">
                    Maklumat Profil
                </button>
            </div>

            <!-- Kandungan Tab -->
            <div class="p-5 sm:p-6 space-y-6">
                
                <!-- TAB 1: SENARAI PAUTAN -->
                <div id="tabPautan" class="admin-tab-content space-y-6">
                    <form id="linkForm" class="p-4 rounded-2xl bg-white/50 dark:bg-white/[0.04] border border-white/80 dark:border-white/10 space-y-3">
                        <h2 id="formTitle" class="text-xs font-bold uppercase tracking-wider text-[#679929] dark:text-[#86be3b]">Tambah Pautan Baru</h2>
                        <input type="hidden" id="editIndex" value="-1">
                        
                        <div>
                            <label class="block text-xs font-medium mb-1">Tajuk Butang *</label>
                            <input type="text" id="inputTajuk" required placeholder="Contoh: Pakej Umrah Terkini" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1">Subtajuk (Pilihan)</label>
                            <input type="text" id="inputSubtajuk" placeholder="Contoh: Daftar awal diskaun RM500" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                        </div>

                        <div>
                            <label class="block text-xs font-medium mb-1">URL Pautan *</label>
                            <input type="url" id="inputUrl" required placeholder="https://..." class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
                            <div>
                                <label class="block text-xs font-medium mb-1">Ikon</label>
                                <select id="inputJenisIkon" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-[#1e2320] border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                                    <option value="whatsapp">WhatsApp / Telefon</option>
                                    <option value="web">Laman Web / Globe</option>
                                    <option value="shop">Katalog / Pakej</option>
                                    <option value="download">Muat Turun / Brosur</option>
                                    <option value="telegram">Telegram / Saluran</option>
                                    <option value="star">Bintang / Istimewa</option>
                                </select>
                            </div>
                            <div class="flex items-end pb-2">
                                <label class="inline-flex items-center gap-2 cursor-pointer text-xs font-medium">
                                    <input type="checkbox" id="inputSorotan" class="rounded text-[#679929] focus:ring-[#679929] w-4 h-4">
                                    <span>Serlahkan Butang Utama</span>
                                </label>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="saveLinkBtn" class="flex-1 py-2.5 px-4 rounded-xl bg-[#679929] hover:bg-[#558021] text-white text-xs font-semibold shadow-sm transition-all">
                                + Tambah Pautan
                            </button>
                            <button type="button" id="cancelEditBtn" class="hidden py-2.5 px-3 rounded-xl bg-white/70 dark:bg-white/10 text-xs font-medium hover:bg-white dark:hover:bg-white/20 transition-colors">
                                Batal
                            </button>
                        </div>
                    </form>

                    <div>
                        <h3 class="text-xs font-bold uppercase tracking-wider text-[#464B4F]/70 dark:text-slate-300 mb-3">Susunan Pautan Semasa</h3>
                        <div id="adminLinksList" class="space-y-2.5"></div>
                    </div>
                </div>

                <!-- TAB 2: MAKLUMAT PROFIL -->
                <div id="tabProfil" class="admin-tab-content hidden space-y-4">
                    <div>
                        <label class="block text-xs font-medium mb-1">Nama Paparan / Syarikat</label>
                        <input type="text" id="profNameInput" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Username (@handle)</label>
                        <input type="text" id="profUserInput" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Bio Ringkas</label>
                        <textarea id="profBioInput" rows="3" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]"></textarea>
                    </div>
                    <div>
                        <label class="block text-xs font-medium mb-1">Fail / URL Gambar Profil (Lalai: ./logoprofil.png)</label>
                        <input type="text" id="profImgInput" placeholder="./logoprofil.png" class="w-full px-3 py-2 rounded-xl text-sm bg-white/80 dark:bg-white/10 border border-white/80 dark:border-white/15 focus:outline-none focus:ring-2 focus:ring-[#679929]">
                    </div>
                    <button type="button" id="saveProfileBtn" class="w-full py-2.5 px-4 rounded-xl bg-[#679929] hover:bg-[#558021] text-white text-xs font-semibold shadow-sm transition-all">
                        Simpan Profil
                    </button>
                </div>

            </div>
        </div>
    </main>

    <!-- Notifikasi Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-2 z-50 px-4 py-2.5 rounded-full bg-[#464B4F] dark:bg-white text-white dark:text-[#464B4F] text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-2">
        <svg id="toastIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#86be3b] dark:text-[#679929]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">Berjaya disimpan!</span>
    </div>

    <script>
        // URL WEB APP GOOGLE APPS SCRIPT ANDA:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmddTfdPk_ZyvhnUjbXqAq_zQSPRfnbmZIzqMtRL3LZE9x1W6HDWWys_R_8bSDwBn5/exec";
        const ADMIN_PIN = "0711";
        let toastTimeoutId = null;
        let animasiAwalSelesai = false;
        let rekodCapAdmin = "";
        let sedangSimpan = false;
        const pustakaIkon = {
            whatsapp: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
            web: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            shop: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
            download: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`,
            telegram: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
            star: `<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
        };

        let appData = {
            profil: { nama: "", username: "", bio: "", gambar: "./logoprofil.png" },
            pautan: []
        };

        function tunjukNotifikasi(mesej, isError = false) {
            const toast = document.getElementById('toastNotification');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');
            toastMsg.textContent = mesej;
            toastIcon.style.color = isError ? '#f87171' : '#86be3b';
            
            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            toastTimeoutId = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
            }, 2500);
        }

        function isiBorangProfil() {
            document.getElementById('profNameInput').value = appData.profil.nama || "";
            document.getElementById('profUserInput').value = appData.profil.username || "";
            document.getElementById('profBioInput').value = appData.profil.bio || "";
            document.getElementById('profImgInput').value = (appData.profil.gambar && appData.profil.gambar !== './logo.png') ? appData.profil.gambar : "./logoprofil.png";
        }

        function janaCapAdmin(data) {
            if (!data) return "";
            const p = data.profil || {};
            const senarai = (data.pautan || []).map(item => `${item.tajuk}|${item.subtajuk}|${item.url}|${item.jenisIkon}|${!!item.sorotan}`).join(";;");
            return `${p.nama}|${p.username}|${p.bio}|${p.gambar}::${senarai}`;
        }

        async function muatDataDariSheet() {
            const cacheTempatan = localStorage.getItem('azzuha_live_cache');
            if (cacheTempatan) {
                try {
                    appData = JSON.parse(cacheTempatan);
                    rekodCapAdmin = janaCapAdmin(appData);
                    isiBorangProfil();
                    renderAdminList(true);
                    animasiAwalSelesai = true;
                } catch (e) {}
            } else {
                const listEl = document.getElementById('adminLinksList');
                listEl.innerHTML = `<div class="space-y-2.5">${[1, 2, 3].map(() => `<div class="h-14 rounded-2xl bg-white/40 dark:bg-white/[0.04] animate-pulse"></div>`).join('')}</div>`;
            }

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?t=" + Date.now(), {
                    method: "GET",
                    redirect: "follow"
                });
                const text = await res.text();
                const json = JSON.parse(text);
                if (json.status === "success" && json.data) {
                    const capBaharu = janaCapAdmin(json.data);
                    if (capBaharu !== rekodCapAdmin || !animasiAwalSelesai) {
                        appData = json.data;
                        rekodCapAdmin = capBaharu;
                        localStorage.setItem('azzuha_live_cache', JSON.stringify(appData));
                        isiBorangProfil();
                        renderAdminList(!animasiAwalSelesai);
                        animasiAwalSelesai = true;
                    }
                }
            } catch (err) {
                if (!cacheTempatan) {
                    tunjukNotifikasi('Gagal menarik data dari Google Sheets.', true);
                    renderAdminList(false);
                }
            }
        }

        async function simpanKeGoogleSheets(mesejBerjaya = 'Perubahan berjaya disimpan!') {
            if (sedangSimpan) return;
            sedangSimpan = true;
            rekodCapAdmin = janaCapAdmin(appData);
            renderAdminList(false);

            const saveLinkBtn = document.getElementById('saveLinkBtn');
            const saveProfileBtn = document.getElementById('saveProfileBtn');
            if (saveLinkBtn) saveLinkBtn.disabled = true;
            if (saveProfileBtn) saveProfileBtn.disabled = true;

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ pin: ADMIN_PIN, data: appData })
                });
                const json = await res.json();

                if (json.status === 'success') {
                    localStorage.setItem('azzuha_live_cache', JSON.stringify(appData));
                    tunjukNotifikasi(mesejBerjaya, false);
                } else {
                    tunjukNotifikasi(json.message || 'Gagal menyimpan perubahan.', true);
                }
            } catch (err) {
                tunjukNotifikasi('Ralat sambungan semasa menyimpan.', true);
            } finally {
                sedangSimpan = false;
                if (saveLinkBtn) saveLinkBtn.disabled = false;
                if (saveProfileBtn) saveProfileBtn.disabled = false;
            }
        }

        function renderAdminList(denganAnimasi = false) {
            const listEl = document.getElementById('adminLinksList');
            if (!appData.pautan || appData.pautan.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-[#464B4F]/60 dark:text-slate-400 text-center py-6 bg-white/40 dark:bg-white/[0.03] rounded-2xl border border-white/60 dark:border-white/10">Tiada pautan lagi. Tambah pautan menggunakan borang di atas.</p>`;
                return;
            }

            listEl.innerHTML = appData.pautan.map((item, idx) => `
                <div style="${denganAnimasi ? `animation-delay: ${idx * 45}ms` : ''}" class="${denganAnimasi ? 'admin-item-enter' : ''} flex items-center justify-between gap-3 p-3 rounded-2xl bg-white/60 dark:bg-white/[0.05] border border-white/80 dark:border-white/10 shadow-sm transition-all duration-200 hover:bg-white/80 dark:hover:bg-white/[0.08]">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <div class="w-8 h-8 rounded-xl flex items-center justify-center shrink-0 ${item.sorotan ? 'bg-[#679929] text-white' : 'bg-[#679929]/15 text-[#679929] dark:text-[#86be3b]'}">
                            ${pustakaIkon[item.jenisIkon] || pustakaIkon.web}
                        </div>
                        <div class="min-w-0">
                            <div class="text-xs font-semibold truncate flex items-center gap-1.5">
                                <span class="truncate">${item.tajuk}</span>
                                ${item.sorotan ? '<span class="px-1.5 py-0.5 text-[10px] rounded-md bg-[#679929]/15 text-[#679929] dark:text-[#86be3b] font-bold shrink-0">Utama</span>' : ''}
                            </div>
                            <div class="text-[11px] text-[#464B4F]/65 dark:text-slate-400 truncate">${item.url}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <button type="button" onclick="gerakPautan(${idx}, -1)" ${idx === 0 ? 'disabled' : ''} title="Naik atas" class="p-1.5 rounded-lg hover:bg-white/80 dark:hover:bg-white/10 disabled:opacity-30 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
                        </button>
                        <button type="button" onclick="gerakPautan(${idx}, 1)" ${idx === appData.pautan.length - 1 ? 'disabled' : ''} title="Turun bawah" class="p-1.5 rounded-lg hover:bg-white/80 dark:hover:bg-white/10 disabled:opacity-30 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
                        </button>
                        <button type="button" onclick="mulaEditPautan(${idx})" title="Sunting" class="p-1.5 rounded-lg text-[#679929] dark:text-[#86be3b] hover:bg-[#679929]/15 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
                        </button>
                        <button type="button" onclick="padamPautan(${idx})" title="Padam" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-500/15 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function resetBorangPautan() {
            document.getElementById('linkForm').reset();
            document.getElementById('editIndex').value = '-1';
            document.getElementById('formTitle').textContent = 'Tambah Pautan Baru';
            document.getElementById('saveLinkBtn').textContent = '+ Tambah Pautan';
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        window.gerakPautan = function(index, arah) {
            const targetIndex = index + arah;
            if (targetIndex < 0 || targetIndex >= appData.pautan.length) return;
            const temp = appData.pautan[index];
            appData.pautan[index] = appData.pautan[targetIndex];
            appData.pautan[targetIndex] = temp;
            simpanKeGoogleSheets('Susunan pautan dikemas kini!');
        };

        window.padamPautan = function(index) {
            appData.pautan.splice(index, 1);
            simpanKeGoogleSheets('Pautan berjaya dipadam!');
        };

        window.mulaEditPautan = function(index) {
            const item = appData.pautan[index];
            if (!item) return;
            document.getElementById('editIndex').value = index;
            document.getElementById('inputTajuk').value = item.tajuk || '';
            document.getElementById('inputSubtajuk').value = item.subtajuk || '';
            document.getElementById('inputUrl').value = item.url || '';
            document.getElementById('inputJenisIkon').value = item.jenisIkon || 'web';
            document.getElementById('inputSorotan').checked = !!item.sorotan;

            document.getElementById('formTitle').textContent = 'Sunting Pautan';
            document.getElementById('saveLinkBtn').textContent = 'Simpan Perubahan';
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            document.getElementById('linkForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
        };

        document.addEventListener('DOMContentLoaded', () => {
            const htmlEl = document.documentElement;
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            }
            const tukarTema = () => {
                htmlEl.classList.toggle('dark');
                localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
            };
            document.getElementById('themeToggleAdmin').addEventListener('click', tukarTema);
            document.getElementById('themeTogglePin').addEventListener('click', tukarTema);

            function bukaKunciAdmin(tanpaFade = false) {
                const overlay = document.getElementById('pinLockOverlay');
                const mainContent = document.getElementById('adminMainContent');
                if (tanpaFade) {
                    overlay.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    muatDataDariSheet();
                    return;
                }
                overlay.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    overlay.classList.add('hidden');
                    mainContent.classList.remove('hidden');
                    muatDataDariSheet();
                }, 220);
            }

            function tunjukRalatPin() {
                const pinInput = document.getElementById('pinCodeInput');
                const pinError = document.getElementById('pinErrorMsg');
                const pinCard = document.getElementById('pinCardBox');
                pinError.classList.remove('hidden');
                pinCard.classList.remove('pin-shake');
                void pinCard.offsetWidth;
                pinCard.classList.add('pin-shake');
                pinInput.value = '';
                pinInput.focus();
            }

            if (sessionStorage.getItem('azzuha_admin_unlocked') === ADMIN_PIN) {
                bukaKunciAdmin(true);
            } else {
                const pinInput = document.getElementById('pinCodeInput');
                const pinError = document.getElementById('pinErrorMsg');
                setTimeout(() => pinInput.focus(), 100);

                pinInput.addEventListener('input', () => {
                    pinError.classList.add('hidden');
                    if (pinInput.value.length === 4) {
                        if (pinInput.value === ADMIN_PIN) {
                            sessionStorage.setItem('azzuha_admin_unlocked', ADMIN_PIN);
                            bukaKunciAdmin(false);
                        } else {
                            tunjukRalatPin();
                        }
                    }
                });

                document.getElementById('pinUnlockForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    if (pinInput.value.trim() === ADMIN_PIN) {
                        sessionStorage.setItem('azzuha_admin_unlocked', ADMIN_PIN);
                        bukaKunciAdmin(false);
                    } else {
                        tunjukRalatPin();
                    }
                });
            }

            document.querySelectorAll('.admin-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.admin-tab').forEach(t => {
                        t.classList.remove('border-[#679929]', 'text-[#679929]', 'dark:text-[#86be3b]');
                        t.classList.add('border-transparent', 'text-[#464B4F]/70', 'dark:text-slate-400');
                    });
                    tab.classList.remove('border-transparent', 'text-[#464B4F]/70', 'dark:text-slate-400');
                    tab.classList.add('border-[#679929]', 'text-[#679929]', 'dark:text-[#86be3b]');

                    const targetId = tab.getAttribute('data-tab');
                    document.querySelectorAll('.admin-tab-content').forEach(c => {
                        c.classList.add('hidden');
                        c.classList.remove('smooth-enter');
                    });
                    const targetEl = document.getElementById(targetId);
                    targetEl.classList.remove('hidden');
                    void targetEl.offsetWidth;
                    targetEl.classList.add('smooth-enter');
                });
            });

            document.getElementById('linkForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const idx = parseInt(document.getElementById('editIndex').value, 10);
                const pautanBaru = {
                    tajuk: document.getElementById('inputTajuk').value.trim(),
                    subtajuk: document.getElementById('inputSubtajuk').value.trim(),
                    url: document.getElementById('inputUrl').value.trim(),
                    jenisIkon: document.getElementById('inputJenisIkon').value,
                    sorotan: document.getElementById('inputSorotan').checked
                };

                if (idx >= 0) {
                    appData.pautan[idx] = pautanBaru;
                    resetBorangPautan();
                    simpanKeGoogleSheets('Pautan dikemas kini!');
                } else {
                    appData.pautan.push(pautanBaru);
                    resetBorangPautan();
                    simpanKeGoogleSheets('Pautan baru ditambah!');
                }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', resetBorangPautan);

            document.getElementById('saveProfileBtn').addEventListener('click', () => {
                appData.profil.nama = document.getElementById('profNameInput').value.trim() || "Azzuha Group Travel & Tours";
                appData.profil.username = document.getElementById('profUserInput').value.trim() || "@azzuhatravel";
                appData.profil.bio = document.getElementById('profBioInput').value.trim();
                appData.profil.gambar = document.getElementById('profImgInput').value.trim() || "./logoprofil.png";
                simpanKeGoogleSheets('Maklumat profil disimpan!');
            });
        });
    </script>
</body>
</html>
